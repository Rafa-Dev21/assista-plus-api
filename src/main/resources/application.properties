spring.application.name=assista-plus-api

spring.datasource.url=jdbc:h2:mem:assistaplus
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.cache.disabled=true
springdoc.swagger-ui.customCss=body{background:#0a0a10!important}.swagger-ui .topbar{background:#0a0a10!important}
springdoc.swagger-ui.url=/v3/api-docs
spring.data.web.pageable.max-page-size=50
spring.data.rest.max-page-size=50


